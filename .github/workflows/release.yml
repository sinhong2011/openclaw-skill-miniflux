name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp
      - name: Build release binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$BUILD_TARGET"
      - name: Rename binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cp "target/${BUILD_TARGET}/release/openclaw-miniflux-mcp" \
             "openclaw-miniflux-mcp-${BUILD_TARGET}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp/openclaw-miniflux-mcp-${{ matrix.target }}

  publish-skill:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Login to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: npx clawhub@latest login --token "$CLAWHUB_TOKEN" --no-browser
      - name: Publish skill
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npx clawhub@latest publish ./skill \
            --slug openclaw-miniflux \
            --name "Miniflux" \
            --version "${RELEASE_TAG#v}" \
            --changelog "Release ${RELEASE_TAG#v}" \
            --tags latest \
            --no-input
